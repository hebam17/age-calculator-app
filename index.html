<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Age calculator app</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <main>
      <div id="calc-container">
        <!-- Info inputs -->
        <div id="info-inputs">
          <!-- Day -->
          <div id="form-field">
            <label for="day-input">DAY</label>
            <input type="text" id="day-input" placeholder="DD" />
          </div>
          <!-- Month -->
          <div id="form-field">
            <label for="month-input">MONTH</label>
            <input type="text" id="month-input" placeholder="MM" />
          </div>
          <!-- Year -->
          <div id="form-field">
            <label for="year-input">YEAR</label>
            <input type="text" id="year-input" placeholder="YYYY" />
          </div>

          <!-- sUBMIT BUTTON -->
          <button type="button" class="icon-button" aria-label="Calculate">
            <svg
              xmlns="http://w3.org"
              viewBox="0 0 100 100"
              aria-hidden="true"
              class="button-icon"
            >
              <line x1="50" y1="0" x2="50" y2="100" />
              <path d="M 2,54 C 20,54 44,70 50,100" />
              <path d="M 98,54 C 80,54 56,70 50,100" />
            </svg>
          </button>
          <!-- //////// -->
        </div>
        <!-- INFO INPUTS END -->

        <!-- RESULTS -->
        <div class="reulst-group">
          <!-- YEARS STARTS -->
          <div class="result">
            <div id="year-result">
              <span id="year1"></span>-<span id="year2">-</span>
            </div>
            <div class="result-text">years</div>
          </div>
          <!-- YEARS ENDS -->

          <!-- MONTH STARTS -->
          <div class="result">
            <div id="month-result">
              <span id="month1"></span>-<span id="month2">-</span>
            </div>
            <div class="result-text">months</div>
          </div>
          <!-- MONTH ENDS -->

          <!-- DAY STARTS -->
          <div class="result">
            <div id="day-result">
              <span id="day1"></span>-<span id="day2">-</span>
            </div>
            <div class="result-text">days</div>
          </div>
          <!-- DAY ENDS -->
        </div>
        <!-- END RESULTS -->
      </div>
    </main>
    <script src="./js/scripts.js"></script>
  </body>
</html>
